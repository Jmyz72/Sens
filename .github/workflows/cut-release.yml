name: Cut release

# One-click release, protected-main edition. Pick a semver level and this:
#   1. runs scripts/release.mjs --branch (bump the 3 version files + Cargo.lock,
#      roll CHANGELOG + link refs, commit on release/vX.Y.Z — no tag),
#   2. pushes that branch and opens a "chore(release): vX.Y.Z" PR,
#   3. dispatches CI on the branch so the PR gets its required checks.
# Merging the PR fires tag-release.yml, which tags the merge commit and builds.
# Nothing is pushed to main directly, so branch protection is respected.
# See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Semver bump level"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # push the release/* branch
      pull-requests: write  # open the release PR
      actions: write        # dispatch ci.yml on the branch
    steps:
      # ref: main + full history/tags so release.mjs's guards (must be on main,
      # tag-not-already-present) see the real branch state.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # cargo is needed for the script's `cargo update -p sens` lockfile refresh.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: npm ci
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, roll changelog, commit on release branch
        id: release
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          npm run release -- "$LEVEL" --branch
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$version" >> "$GITHUB_OUTPUT"
      - name: Push release branch
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: git push -u origin "$BRANCH"
      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "Release **v$VERSION** — bumps the version files and rolls \`CHANGELOG.md\`."
            echo
            echo "Merging this PR tags \`v$VERSION\` on the merge commit and builds the"
            echo "macOS + Windows release (tag-release.yml). Use **squash** or **merge**; either works."
            echo
            echo "_Opened by the Cut release workflow. CI was dispatched on this branch because"
            echo "PRs opened by \`GITHUB_TOKEN\` do not trigger \`pull_request\` workflows._"
          } > pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): v$VERSION" --body-file pr-body.md
      # PRs/pushes made with GITHUB_TOKEN don't trigger pull_request/push workflows,
      # but workflow_dispatch is the documented exception. CI's check runs land on
      # the branch head SHA (= the PR head), which satisfies the required checks.
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
