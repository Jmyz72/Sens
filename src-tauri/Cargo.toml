[package]
name = "sens"
version = "0.12.0"
description = "Sens — local-first personal finance tracker"
authors = ["Sens"]
edition = "2021"

[lib]
name = "sens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
thiserror = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
rand = "0.9"
schemars = "1.0"
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
axum = "0.8"
rmcp = { version = "3.7", features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# MCP client for the server's end-to-end tests.
rmcp = { version = "3.7", features = ["client", "transport-streamable-http-client-reqwest"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
